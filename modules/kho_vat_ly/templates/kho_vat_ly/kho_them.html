{% extends "kho_vat_ly/base.html" %}
{% block title %}Thêm kho vật lý{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="bi bi-plus-circle me-2 text-primary"></i>Thêm kho vật lý</h1>
</div>

<div class="card" style="max-width:520px">
  <div class="card-body">
    <form method="POST" action="/kho-vat-ly/kho-quan-ly/them">
      <div class="mb-3">
        <label class="form-label fw-semibold">Mã kho <span class="text-danger">*</span></label>
        <input type="text" name="code" class="form-control font-monospace text-uppercase"
               placeholder="VD: KHO_TC" maxlength="20" required>
        <div class="form-text">Mã viết tắt, không dấu, dùng để phân biệt kho (tự động viết hoa).</div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Tên kho <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" placeholder="VD: Kho Tiên Cầu" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Địa chỉ</label>
        <input type="text" name="address" class="form-control" placeholder="Địa chỉ kho (tuỳ chọn)">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>Lưu</button>
        <a href="/kho-vat-ly/kho-quan-ly" class="btn btn-outline-secondary">Huỷ</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
