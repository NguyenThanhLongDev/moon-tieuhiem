{% extends "kho_vat_ly/base.html" %}
{% block title %}Sửa kho — {{ wh.name }}{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="bi bi-pencil-square me-2 text-primary"></i>Sửa kho — <span class="font-monospace">{{ wh.code }}</span></h1>
</div>

<div class="card" style="max-width:520px">
  <div class="card-body">
    <form method="POST" action="/kho-vat-ly/kho-quan-ly/{{ wh.id }}/sua">
      <div class="mb-3">
        <label class="form-label fw-semibold">Mã kho</label>
        <input type="text" class="form-control font-monospace" value="{{ wh.code }}" disabled>
        <div class="form-text text-muted">Mã kho không thể thay đổi sau khi tạo.</div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Tên kho <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" value="{{ wh.name }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Địa chỉ</label>
        <input type="text" name="address" class="form-control" value="{{ wh.address or '' }}">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Trạng thái</label>
        <select name="status" class="form-select">
          <option value="active" {% if wh.status == 'active' %}selected{% endif %}>Hoạt động</option>
          <option value="inactive" {% if wh.status == 'inactive' %}selected{% endif %}>Tạm dừng</option>
        </select>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>Lưu</button>
        <a href="/kho-vat-ly/kho-quan-ly" class="btn btn-outline-secondary">Huỷ</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
