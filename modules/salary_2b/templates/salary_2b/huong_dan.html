<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hướng dẫn bảng lương 2B</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/cc-theme.css">
<style>
body { background:#f5f6fa; font-family:'Segoe UI',sans-serif; font-size:14.5px; }
.topbar { background:#1a1a1a; padding:10px 20px; color:#fff; display:flex; align-items:center; gap:16px; }
.topbar a { color:#aaa; text-decoration:none; }
.topbar .brand { color:#F59E0B; font-weight:700; }
.wrap { max-width:900px; margin:18px auto 60px; padding:24px 28px; background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.wrap h1 { font-size:22px; border-bottom:3px solid #F59E0B; padding-bottom:8px; }
.wrap h2 { font-size:17px; margin-top:28px; color:#92600a; }
.wrap h3 { font-size:15px; margin-top:20px; }
.wrap code { background:#faf3e3; color:#92600a; padding:1px 5px; border-radius:4px; }
.wrap pre { background:#1a1a1a; color:#eee; padding:12px 14px; border-radius:8px; font-size:12.5px; overflow-x:auto; }
.wrap pre code { background:none; color:#eee; }
.wrap blockquote { border-left:4px solid #F59E0B; margin:10px 0; padding:6px 14px; background:#fdf6e9; color:#555; }
.wrap table { border-collapse:collapse; margin:10px 0; }
.wrap th, .wrap td { border:1px solid #e5e5e5; padding:5px 10px; font-size:13px; }
.wrap th { background:#faf7f0; }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">⚙ Tiểu Hiềm</span>
  <a href="/">Trang chủ</a>
  <a href="/salary-2b/">Bảng lương 2B</a>
  <a href="/salary-2b/config">Cấu hình</a>
  <span style="color:#F59E0B">Hướng dẫn</span>
</div>
<div class="wrap" id="doc">Đang tải...</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const md = {{ md_content | tojson }};
document.getElementById('doc').innerHTML = marked.parse(md);
</script>
</body>
</html>
